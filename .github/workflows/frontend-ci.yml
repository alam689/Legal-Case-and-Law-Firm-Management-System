name: Frontend CI

# docs/05-frontend-plan.md §14 — blocking gate:
# typecheck · lint (a11y, i18n literal, import boundary) · unit+component
# · permission matrix · bundle budget
on:
  push:
    branches: [main, develop]
    paths: ['web/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'eslint.config.js', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['web/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'eslint.config.js', '.github/workflows/frontend-ci.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ⚠ কোনো `version:` input দেওয়া যাবে না।
      #
      # root `package.json`-এ `packageManager: "pnpm@9.15.9"` আছে, আর
      # action-setup v4 দুটো একসাথে পেলে থেমে যায়:
      # "Multiple versions of pnpm specified". সংস্করণের একমাত্র উৎস
      # `packageManager` — তাতে local ও CI কখনো আলাদা pnpm-এ চলে না।
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm size
